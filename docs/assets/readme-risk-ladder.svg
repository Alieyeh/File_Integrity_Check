<svg xmlns="http://www.w3.org/2000/svg" width="980" height="230" viewBox="0 0 980 230" role="img" aria-labelledby="title desc">
  <title id="title">File Integrity Monitor risk ladder</title>
  <desc id="desc">A colored overview showing the risk levels and the monitoring workflow.</desc>
  <rect width="980" height="230" rx="18" fill="#f1e9ff"/>
  <rect x="18" y="18" width="944" height="194" rx="14" fill="#fffbff" stroke="#ded0f0"/>
  <text x="42" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#25142f">Risk priority ladder</text>
  <text x="42" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#765c86">Designed for metadata-first TRE scans, with exact fingerprint reversion when approved.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="42" y="104" width="168" height="72" rx="10" fill="#b42318"/>
    <text x="62" y="132" font-size="15" font-weight="700" fill="#ffffff">Extremely High</text>
    <text x="62" y="154" font-size="12" fill="#fff0ed">Fingerprint reversion</text>

    <rect x="226" y="104" width="168" height="72" rx="10" fill="#b54708"/>
    <text x="246" y="132" font-size="15" font-weight="700" fill="#ffffff">High</text>
    <text x="246" y="154" font-size="12" fill="#fff3e0">Deletion or strong</text>
    <text x="246" y="169" font-size="12" fill="#fff3e0">metadata reversion</text>

    <rect x="410" y="104" width="168" height="72" rx="10" fill="#c59a00"/>
    <text x="430" y="132" font-size="15" font-weight="700" fill="#25142f">Medium</text>
    <text x="430" y="154" font-size="12" fill="#25142f">Move, content change,</text>
    <text x="430" y="169" font-size="12" fill="#25142f">weaker metadata signal</text>

    <rect x="594" y="104" width="168" height="72" rx="10" fill="#3156a3"/>
    <text x="614" y="132" font-size="15" font-weight="700" fill="#ffffff">Low</text>
    <text x="614" y="154" font-size="12" fill="#e9f0ff">Rename or timestamp</text>
    <text x="614" y="169" font-size="12" fill="#e9f0ff">signal</text>

    <rect x="778" y="104" width="142" height="72" rx="10" fill="#24744f"/>
    <text x="798" y="132" font-size="15" font-weight="700" fill="#ffffff">Clear</text>
    <text x="798" y="154" font-size="12" fill="#e6f5ee">No alert-level</text>
    <text x="798" y="169" font-size="12" fill="#e6f5ee">events</text>
  </g>
</svg>
